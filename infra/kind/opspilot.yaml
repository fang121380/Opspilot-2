apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: demo
data:
  alertmanager.yml: |
    route:
      receiver: opspilot-2
      group_by: [alertname, namespace, service]
      group_wait: 0s
      group_interval: 30s
      repeat_interval: 1h
    receivers:
      - name: opspilot-2
        webhook_configs:
          - url: http://opspilot-2.demo.svc.cluster.local:8000/webhooks/prometheus
            send_resolved: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opspilot-2
  namespace: demo
  labels:
    app: opspilot-2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opspilot-2
  template:
    metadata:
      labels:
        app: opspilot-2
    spec:
      serviceAccountName: opspilot-2
      containers:
        - name: api
          image: opspilot-2/api:dev
          imagePullPolicy: Never
          env:
            - name: OPSPILOT_ENVIRONMENT
              value: kind-demo
            - name: OPSPILOT_PROMETHEUS_URL
              value: http://prometheus.demo.svc.cluster.local:9090
            - name: OPSPILOT_ALLOWED_REMEDIATION_NAMESPACES
              value: demo
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: opspilot-2
  namespace: demo
spec:
  selector:
    app: opspilot-2
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: demo
  labels:
    app: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: quay.io/prometheus/alertmanager:v0.28.1
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - name: http
              containerPort: 9093
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: demo
spec:
  selector:
    app: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: http
