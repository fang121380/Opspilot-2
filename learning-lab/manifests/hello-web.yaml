apiVersion: v1
kind: Namespace
metadata:
  name: learning
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-web
  namespace: learning
  labels:
    app: hello-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-web
  template:
    metadata:
      labels:
        app: hello-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hello-web
  namespace: learning
spec:
  selector:
    app: hello-web
  ports:
    - name: http
      port: 80
      targetPort: http

