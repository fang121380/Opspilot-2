name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m pytest --cov=app --cov-report=term-missing
      - run: python scripts/run-evals.py
      - run: python scripts/run-local-demo.py
      - name: Build container image
        run: docker build --tag opspilot-2:ci .

  compose-runtime:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Start Compose runtime and wait for health
        run: docker compose up -d --build --wait
      - name: Verify API and interrupted Job recovery dry-run
        run: |
          curl --fail --retry 5 --retry-connrefused http://127.0.0.1:8000/health
          docker compose exec -T opspilot python -m app.job_recovery
      - name: Clean up Compose resources
        if: always()
        run: docker compose down --volumes --remove-orphans
